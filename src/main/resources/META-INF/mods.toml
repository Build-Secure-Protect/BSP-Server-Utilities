modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with BSP-Core the mod reads its database settings and server id and adds boards to its Score Screens.
[[dependencies.${mod_id}]]
    modId="bsp_core"
    mandatory=false
    versionRange="${bsp_core_version_range}"
    ordering="AFTER"
    side="BOTH"
