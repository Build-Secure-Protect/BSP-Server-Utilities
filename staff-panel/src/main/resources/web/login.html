<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BSP Staff: log in</title>
<link rel="stylesheet" href="/static/panel.css">
<script src="/static/common.js" defer></script>
<script src="/static/login.js" defer></script>
</head>
<body>
<div class="centre">
  <form class="card" id="form" autocomplete="on">
    <div class="brand">BSP <b>STAFF</b></div>
    <div>
      <h1>Log in</h1>
      <div class="note">Signed in to Cloudflare as <b id="who">…</b></div>
    </div>
    <div class="err hidden" id="err"></div>
    <label>Password
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <label>Code from your authenticator app
      <input type="text" class="code" id="code" autocomplete="one-time-code" inputmode="text" maxlength="12" required>
      <span class="note">Lost your phone? Type one of your backup codes instead.</span>
    </label>
    <button class="btn" id="go" type="submit">Log in</button>
    <div class="note">A login lasts 7 days for Moderators and 48 hours for Admins and Owners.</div>
  </form>
</div>
</body>
</html>
