<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 0; background: #1b2129; overflow: hidden; }
#shot { position: absolute; left: 0; top: 0; display: inline-block; }
.bgworld { padding: 18px; background:
    linear-gradient(rgba(10,14,20,.58), rgba(10,14,20,.58)),
    radial-gradient(ellipse at 20% 85%, #3d5a3a 0, transparent 45%),
    radial-gradient(ellipse at 75% 90%, #4b6b45 0, transparent 40%),
    radial-gradient(ellipse at 60% 20%, #6d8fb3 0, transparent 55%),
    linear-gradient(#8fb2d6, #5f7f9e 55%, #3a5137 56%, #2d3f2b); }
.cap { font: 600 13px "IBM Plex Sans", sans-serif; color: #e6eaf2; }
.capm { font: 400 12px "IBM Plex Sans", sans-serif; color: #9aa3b5; }
.vt { font-family: "VT323", monospace; -webkit-font-smoothing: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans:wght@400;600&display=swap"></head>
<body><div id="shot"><div style="padding:22px 26px;background:#10151C;display:flex;gap:30px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="position:relative;width:216px;height:144px;background-color:#7d7d7d;background-image:linear-gradient(rgba(0,0,0,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.22) 2px, transparent 2px),linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),radial-gradient(circle at 30% 40%, rgba(255,255,255,.06), transparent 30%), radial-gradient(circle at 70% 70%, rgba(0,0,0,.08), transparent 35%);background-size:72px 36px, 72px 72px, 18px 18px, 18px 18px, 72px 72px, 144px 72px;"><div style="position:absolute;left:72px;top:36.0px;width:72px;height:72px;background:#2A2F3A;box-shadow:0 6px 14px rgba(0,0,0,.45)"><div style="position:absolute;inset:4px;background:#0C0E12;overflow:hidden"></div><div style="position:absolute;right:8px;bottom:1px;width:12px;height:2px;background:#19D3B0"></div></div></div><div class="cap">One block</div><div class="capm">a thin wall panel</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="position:relative;width:288px;height:144px;background-color:#7d7d7d;background-image:linear-gradient(rgba(0,0,0,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.22) 2px, transparent 2px),linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),radial-gradient(circle at 30% 40%, rgba(255,255,255,.06), transparent 30%), radial-gradient(circle at 70% 70%, rgba(0,0,0,.08), transparent 35%);background-size:72px 36px, 72px 72px, 18px 18px, 18px 18px, 72px 72px, 144px 72px;"><div style="position:absolute;left:72px;top:36.0px;width:144px;height:72px;background:#2A2F3A;box-shadow:0 6px 14px rgba(0,0,0,.45)"><div style="position:absolute;inset:4px;background:#0C0E12;overflow:hidden"><div style="position:absolute;left:68px;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.18)"></div></div><div style="position:absolute;right:8px;bottom:1px;width:12px;height:2px;background:#19D3B0"></div></div></div><div class="cap">Two side by side</div><div class="capm">one panel, one bezel</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="position:relative;width:432px;height:216px;background-color:#7d7d7d;background-image:linear-gradient(rgba(0,0,0,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.22) 2px, transparent 2px),linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),radial-gradient(circle at 30% 40%, rgba(255,255,255,.06), transparent 30%), radial-gradient(circle at 70% 70%, rgba(0,0,0,.08), transparent 35%);background-size:72px 36px, 72px 72px, 18px 18px, 18px 18px, 72px 72px, 144px 72px;"><div style="position:absolute;left:72px;top:36.0px;width:288px;height:144px;background:#2A2F3A;box-shadow:0 6px 14px rgba(0,0,0,.45)"><div style="position:absolute;inset:4px;background:#0C0E12;overflow:hidden"><div style="position:absolute;left:68px;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.18)"></div><div style="position:absolute;left:140px;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.18)"></div><div style="position:absolute;left:212px;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.18)"></div><div style="position:absolute;top:68px;left:0;right:0;border-top:1px dashed rgba(255,255,255,.18)"></div></div><div style="position:absolute;right:8px;bottom:1px;width:12px;height:2px;background:#19D3B0"></div></div></div><div class="cap">Up to 8 wide and 6 high</div><div class="capm">nothing between the blocks; settings shared</div></div></div></div>
<script>
document.fonts.ready.then(() => setTimeout(() => {
  const r = document.getElementById('shot').getBoundingClientRect();
  document.title = Math.ceil(r.width) + 'x' + Math.ceil(r.height);
}, 300));
</script>
</body></html>
